spring.application.name=backend

# Local secrets live in .env (gitignored). See .env.example.
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lifeorganizer}
spring.datasource.username=${DB_USERNAME:lifeorganizer}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT (HS256). JWT_SECRET must be base64 and decode to at least 32 bytes.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=life-organizer
app.jwt.expiration=1h

# Rate limiting for POST /api/register, per client IP
app.rate-limit.max-requests=5
app.rate-limit.window=1m

# HTTPS
server.port=${SERVER_PORT:8432}
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE:file:certs/dev-keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=lifeorganizer
